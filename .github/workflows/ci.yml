# CI — the gate every change passes (PROJECT_RULES.md §7).
# Runs: control-plane build/vet/test, the Door-5 gem-unmodified assertion + the real Docker
# gem resolution, the no-secret-leak boot scan, the docs-updated staleness check, config-reference
# freshness, and the code-reviewer gate. It MUST NOT fake green: rollout-only truths (greylist
# retry-then-accept, vendor accuracy) are never asserted here (Docs/test-strategy.md §4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    name: control-plane (Go build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    # A real Postgres so the store + Door-2 append-only integration tests actually RUN in CI
    # (they SKIP without TM_TEST_DATABASE_URL — proving append-only on every push, not just
    # locally). The migrations are applied below before the tests.
    #
    # HOW THE APPEND-ONLY CLAIM IS ACTUALLY KEPT (D13 / fix-plan item 3). This job connects as the
    # superuser `postgres`, so a test that merely ATTEMPTS a forbidden DELETE and skips when it
    # succeeds proves nothing here — it always skips. Two tests were written that way and always
    # skipped while this comment claimed the enforcement was proven. The grant tests now live in
    # internal/store/pg_grants_test.go and run every forbidden statement inside a transaction that
    # has `SET LOCAL ROLE cp_runtime`, which drops superuser for the duration. cp_runtime therefore
    # stays NOLOGIN (0005_grants.sql) and needs no CI password. TestPGGrants_RoleSwitchActuallyBites
    # is the control: it fails if the role switch ever stops dropping privilege, so the other grant
    # tests cannot go quietly vacuous the way their predecessors did.
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go vet ./...
      # Apply the P1 migrations to the CI Postgres so the gated store tests exercise real DDL.
      - name: apply migrations
        run: |
          # Apply every migration in lexical order (0001, 0002, …) so new migrations are picked up
          # without editing this list. `sort` on the zero-padded prefixes gives the correct order.
          for f in $(ls migrations/[0-9][0-9][0-9][0-9]_*.sql | sort); do
            PGPASSWORD=ci psql -h localhost -U postgres -d cptest -v ON_ERROR_STOP=1 -f "$f"
          done
      # The GAP harness tests SKIP with PENDING reasons — that is expected and honest
      # (behavioral layer scaffolded, not faked). -v so the SKIP reasons are visible.
      # TM_TEST_DATABASE_URL is set so the store's PG integration tests RUN (not skip).
      - name: go test (with real Postgres)
        env:
          TM_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/cptest
        run: go test -v ./...
      # EXECUTION, not merely discovery. The step above exits 0 and prints `ok` for a package in which
      # every test SKIPPED — which is exactly what audit D13 was: two grant tests that always skipped
      # while the comment at the top of this job claimed they proved append-only on every push.
      # Measured 2026-08-06: with this DSN set, 376 of 381 tests execute; with it EMPTY, 345 execute
      # and 36 skip, and `go test ./...` still exits 0 with `ok` on every package. This gate fails on
      # any shortfall, so an emptied secret can no longer read as green. It runs the suite a SECOND
      # time (~3s) on purpose: making it the test runner would move `go test ./...` out of this
      # workflow and turn check-test-enumeration.sh rule 1 red, correctly.
      #
      # working-directory overrides this job's control-plane default: the gate lives at the repo root
      # and cd's into the module itself.
      - name: test-execution gate (every declared test actually RAN)
        working-directory: .
        env:
          TM_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/cptest
        run: bash scripts/check-test-execution.sh
      # The PAIRED CONTROL for the step above. On a green tree that gate prints ok, which means every
      # one of its failure branches is unexercised — it could be broken to accept everything and this
      # workflow would stay green forever. This self-test builds throwaway fixtures that trip each
      # branch and asserts BOTH the exit code and the message, because a gate that fails for the wrong
      # reason is not a control. It includes the break that found a real hole in the gate: a workflow
      # pointing at `${{ secrets.PGDSN }}` with that secret EMPTY passed the gate's first version with
      # `ok [DEGRADED]` and exit 0 while 31 tests did not run.
      #
      # It needs no database — its fixtures are dependency-free Go modules in a temp dir — so it is a
      # step here only because Go is already set up in this job.
      - name: test-execution gate SELF-TEST (the paired control)
        working-directory: .
        run: bash scripts/check-test-execution-selftest.sh

  door5-gem-unmodified:
    name: verifier-node (Door 5 — engine pinned, unmodified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host-portable check: exact pin, no vendored engine source, ADR-0003 agreement.
      - run: bash verifier-node/truemail-rack/bin/assert-gem-unmodified.sh
      # The REAL resolution (not stubbed): build the node and assert bundle resolved 3.3.1.
      - name: Docker build resolves the pinned gem to 3.3.1
        run: |
          docker build --pull --no-cache -t truemail-verifier-node:ci verifier-node/truemail-rack
          v="$(docker run --rm truemail-verifier-node:ci bundle list | grep -oE 'truemail \(3\.3\.1\)' || true)"
          test -n "$v" || { echo "FAIL: resolved truemail != 3.3.1 (got '$v')"; exit 1; }
          echo "OK: verifier-node resolved truemail 3.3.1"

  # A SEPARATE, static job (no Docker build): the image's BASE must be digest-pinned, on a supported Debian, at the Ruby
  # patch .ruby-version names, and every `docker build` in this file must pass `--pull --no-cache`. The first from-scratch
  # build on a real runner found that the base (ruby:3.2.0-slim = Debian 11) could no longer `apt-get install` — it had been
  # buildable only from a warm cache for months (ADR-0018). A red HERE reads as "the base-image pin regressed", not as a
  # build failure somewhere inside a 380-test run. The selftest is its paired control: it proves each assertion can FAIL.
  base-image-pinned:
    name: verifier-node base image (digest-pinned, supported Debian, built without a cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: base image pinned by digest, on supported Debian, matches .ruby-version, CI builds uncached
        run: bash scripts/check-base-image-pinned.sh
      - name: base-image-pinned SELF-TEST (the paired control)
        run: bash scripts/check-base-image-pinned-selftest.sh

  # The image installs EXACTLY the gems in a committed Gemfile.lock (ADR-0018 addendum). The Dockerfile used to run `bundle lock`
  # on every build, so only truemail and net-smtp were pinned and every transitive gem floated: a digest-pinned base made the OS
  # layer reproducible while the gems above it were not. Static; needs no Ruby, Docker or network.
  gemfile-lock:
    name: verifier-node gems (committed Gemfile.lock, installed frozen, agrees with the Door 5 pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lock tracked, image installs it frozen, truemail/net-smtp/bundler/Ruby agree with the Gemfile
        run: bash scripts/check-gemfile-lock.sh
      - name: gemfile-lock SELF-TEST (the paired control)
        run: bash scripts/check-gemfile-lock-selftest.sh

  # A SEPARATE job (ADR-0019). The control plane's DNS resolution must give the same answer on a host whose resolv.conf has a
  # `search` domain as on one that has none: Go's resolver walks the search list and returns the LAST name's error, so a SERVFAIL
  # for the user's domain used to be overwritten by the NXDOMAIN of the suffixed name, and our DNS outage was reported as
  # `invalid / no_mx` — our failure stated as a fact about their address. The dev host has no search domain; a cloud VM does,
  # which is the only reason this was ever possible to miss. Needs only Go and Docker (the DNS server is in the test binary).
  dns-search-domain:
    name: control-plane DNS (a SERVFAIL is unknown, never invalid; an A-only domain is not invalid — real DNS shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: DNS tests pass inside a container whose resolv.conf has a search domain
        run: bash scripts/check-dns-search-domain.sh
      # Its PAIRED CONTROL: the same fixture against a build with name-rooting disabled must go RED on the SERVFAIL case, with the
      # canary green. Keeps "this fixture reds without the fix" true on every run.
      - name: dns-search-domain SELF-TEST (the fixture goes RED when name-rooting is disabled)
        run: bash scripts/check-dns-search-domain-selftest.sh
      # ADR-0020 — RFC 5321 §5.1 implicit MX against REAL DNS shapes. A domain with no MX but an A/AAAA record receives mail at that
      # host and is NOT `invalid / no_mx`; `invalid` is stated only when MX, A and AAAA are all provably absent; null MX stays invalid
      # even with an A record; an outage of ours is `unknown`. The earlier fallback was dead code (it sat behind a resolver answer Go
      # never produces and every fixture was a fake that produced it), so this gate speaks the real protocol and proves it can fail.
      - name: implicit MX (A-only is not invalid; no-records and null-MX still are) — wire level and end to end
        run: bash scripts/check-implicit-mx.sh
      - name: implicit-mx SELF-TEST (the gate goes RED with the address follow-up removed, and with an AAAA failure counted as absent)
        run: bash scripts/check-implicit-mx-selftest.sh

  # ADR-0019 addendum — "a documented deployment rule is not a control". The verifier node's host audit goes RED (so the brain routes it no
  # SMTP) when its resolver is not clean: a `search`/`domain` line, `ndots` > 1, or a dotted hostname (which Ruby turns into a search
  # domain even when resolv.conf is clean). Runs the REAL fork module under the node image's own digest-pinned Ruby against a real mounted
  # resolv.conf and hostname, with Ruby's own resolver as an oracle, and proves the check can fail with one mutant per rule. Needs only
  # Docker; the gem is not involved (stdlib only), so this does not build the node image.
  verifier-node-resolver-hygiene:
    name: verifier-node resolver hygiene (a dirty resolver turns the audit red — real Ruby, real resolv.conf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: resolver hygiene against the real Ruby, with Ruby's own resolver as the oracle
        run: bash scripts/check-resolver-hygiene.sh
      - name: resolver-hygiene SELF-TEST (the gate goes RED with the search, hostname or ndots rule disabled)
        run: bash scripts/check-resolver-hygiene-selftest.sh

  # ADR-0021 — the verifier node never opens an SMTP session to a non-public address (loopback, RFC 1918, link-local/cloud metadata, CGNAT, ...).
  # The guard's decisions are judged by an INDEPENDENT oracle (Python's ipaddress, test points generated from its own transcription of the IANA
  # registries), the shipped egress firewall ruleset is checked against the guard's ranges and with `nft -c`, and four mutants prove the gate can fail.
  # Needs only Docker.
  verifier-node-probe-guard:
    name: verifier-node SMTP probe destination guard (independent oracle + egress ruleset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe guard vs the independent oracle; egress ruleset in step with the guard
        run: bash scripts/check-probe-guard.sh
      - name: probe-guard SELF-TEST (the gate goes RED with CGNAT, link-local, 172.16/12 or the firewall's CGNAT removed)
        run: bash scripts/check-probe-guard-selftest.sh

  verifier-node-rspec:
    name: verifier-node (RSpec — stock + /v1 wrapper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the fork's own RSpec suite (stock specs + the P2 /v1 wrapper specs). The gem is
      # STUBBED here (fast, no socket) — the socket-level wire proof (test/p2) is a separate,
      # Docker-heavy harness run out of band (Docs/history/phase-2-status.md). The fork's SimpleCov 100%
      # line-coverage config is a pre-existing threshold; we assert on TEST FAILURES (behavior),
      # not that threshold — COVERAGE=0 disables the SimpleCov exit-2 so a real spec failure is
      # what fails this job, never the wrapper lowering the ratio.
      - name: rspec in the built node image
        run: |
          docker build --pull --no-cache -t truemail-verifier-node:ci verifier-node/truemail-rack
          docker run --rm -e VERIFIER_EMAIL=verifier@example.test -e ACCESS_TOKENS=token -e COVERAGE=0 \
            truemail-verifier-node:ci sh -c 'cd /app && bundle config unset --local without && bundle install --jobs 2 --retry 3 >/dev/null 2>&1 && bundle exec rspec --no-color'

  no-secret-leak:
    name: no-secret-leak (boot log carries no credential)
    runs-on: ubuntu-latest
    # A SEPARATE job, not a step in control-plane: it needs no database, and keeping it independent
    # means a red here reads unambiguously as "a credential reached a log line" rather than being
    # buried in a 380-test run. See fix-plan 14.4 / audit D12 — the absence of this gate is what let
    # the pgx DSN leak sit unnoticed. The precedent is coldmail-send-byo's harness check of the same
    # name; this one boots the real binary because M1 has no compose stack yet (fix-plan item 15).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: boot with canary secrets and scan the log
        run: bash scripts/check-no-secret-leak.sh

  docs-discipline:
    name: docs-updated + config-reference freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # docs-updated needs history to diff against the base
      # The base ref is passed EXPLICITLY, which puts the gate in RANGE mode and is what makes CI the
      # enforcement point for committed work. It also matters that this argument is present: without
      # it, and with no origin/main in the checkout, the gate judges only uncommitted work — and CI
      # has none. That is the N2 fix's boundary, and check-docs-updated-selftest case 10 fails if the
      # commit-range path is ever disarmed.
      - name: docs-updated staleness gate
        run: bash scripts/check-docs-updated.sh "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      - name: docs-updated SELF-TEST (the paired control)
        run: bash scripts/check-docs-updated-selftest.sh
      - name: config-reference freshness
        run: bash scripts/check-config-reference-fresh.sh
      # The META-GATE: it checks that this workflow's own test DISCOVERY still holds, and that every
      # check script is actually named here. M1's Go and RSpec tests are found automatically (a
      # module-wide `go test ./...` and RSpec's default glob), which is why M1 needs no go_suite list
      # — but those two properties can be lost silently, by a second go.mod, a //go:build tag on a
      # test file, an .rspec --pattern, or CI hand-listing packages. Modules 2 and 3 each shipped
      # tests that were written, passing, and run by nothing; a prose warning did not prevent the
      # recurrence, because a warning comment is not a control. These two steps are the control.
      - name: test-enumeration meta-gate (discovery intact + every gate wired)
        run: bash scripts/check-test-enumeration.sh
      - name: test-enumeration meta-gate SELF-TEST (the paired control)
        run: bash scripts/check-test-enumeration-selftest.sh

  code-review:
    name: code-reviewer gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The code-reviewer gate runs on every change (PROJECT_RULES.md §7). This job is the
      # CI hook for it; the reviewer checks correctness, the additive-only doors, no hardcoded
      # manifest flag, no secret in the diff, and no future-phase mechanism built early.
      # Wired to the org's code-review action/runner at integration.
      #
      # THIS COMMENT USED TO CLAIM "a placeholder that FAILS if removed keeps the gate from silently
      # disappearing." It was FALSE, break-verified 2026-08-05: deleting this entire job left all five
      # gates rc=0 and nothing noticed. The comment WAS the whole mechanism — a warning comment is not
      # a control. What actually keeps this job here now is rule 6 of scripts/check-test-enumeration.sh,
      # which fails if a PROJECT_RULES.md §7 job is absent from this file. Verified by deleting the job
      # again with the rule in place and watching the gate go red.
      - run: |
          echo "code-reviewer gate: wired to the org reviewer at integration (PROJECT_RULES.md §7)."
          echo "This step is a visible placeholder — do not delete it; deleting the gate is a rules violation."
