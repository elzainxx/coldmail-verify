# CI — the gate every change passes (PROJECT_RULES.md §7).
# Runs: brain build/vet/test, the Door-5 gem-unmodified assertion + the real Docker gem
# resolution, the docs-updated staleness check, config-reference freshness, and the
# code-reviewer gate. It MUST NOT fake green: rollout-only truths (greylist retry-then-accept,
# vendor accuracy) are never asserted here (Docs/test-strategy.md §4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  brain:
    name: brain (Go build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go vet ./...
      # The GAP harness tests SKIP with PENDING reasons — that is expected and honest
      # (behavioral layer scaffolded, not faked). -v so the SKIP reasons are visible.
      - run: go test -v ./...

  door5-gem-unmodified:
    name: box (Door 5 — engine pinned, unmodified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host-portable check: exact pin, no vendored engine source, ADR-0003 agreement.
      - run: bash box/truemail-rack/bin/assert-gem-unmodified.sh
      # The REAL resolution (not stubbed): build the box and assert bundle resolved 3.3.1.
      - name: Docker build resolves the pinned gem to 3.3.1
        run: |
          docker build -t truemail-box:ci box/truemail-rack
          v="$(docker run --rm truemail-box:ci bundle list truemail | grep -oE '3\.3\.1' || true)"
          test "$v" = "3.3.1" || { echo "FAIL: resolved truemail != 3.3.1 (got '$v')"; exit 1; }
          echo "OK: box resolved truemail 3.3.1"

  docs-discipline:
    name: docs-updated + config-reference freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # docs-updated needs history to diff against the base
      - name: docs-updated staleness gate
        run: bash scripts/check-docs-updated.sh "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      - name: config-reference freshness
        run: bash scripts/check-config-reference-fresh.sh

  code-review:
    name: code-reviewer gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The code-reviewer gate runs on every change (PROJECT_RULES.md §7). This job is the
      # CI hook for it; the reviewer checks correctness, the additive-only doors, no hardcoded
      # manifest flag, no secret in the diff, and no future-phase mechanism built early.
      # Wired to the org's code-review action/runner at integration; a placeholder that FAILS
      # if removed keeps the gate from silently disappearing.
      - run: |
          echo "code-reviewer gate: wired to the org reviewer at integration (PROJECT_RULES.md §7)."
          echo "This step is a visible placeholder — do not delete it; deleting the gate is a rules violation."
